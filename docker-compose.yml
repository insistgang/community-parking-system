version: '3.8'

services:
  # ==========================================
  # 后端 FastAPI 业务与调度引擎
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parking-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/data/parking.db
    volumes:
      # 持久化挂载 SQLite 数据库，容器重启/升级数据永不丢失
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - parking-net

  # ==========================================
  # 前端 Vue 3 + Nginx 高性能网关
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parking-frontend
    restart: always
    depends_on:
      - backend
    ports:
      # 默认映射宿主机 80 端口，可通过 .env 或环境变量 PORT 任意修改
      - "${PORT:-80}:80"
    networks:
      - parking-net

networks:
  parking-net:
    driver: bridge
